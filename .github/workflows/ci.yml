name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + mcp extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
          python -m pip install pytest ruff

      # The core must import without any third-party package - that is the
      # promise the README makes. Asserted statically too, in
      # tests/test_packaging.py, which runs before the extras are imported.
      - name: Zero-dependency core check
        run: python -c "import pcaplens, pcaplens.cli, pcaplens.dissect, pcaplens.aggregate; print('core imports with no third-party package')"

      - name: Lint
        run: ruff check src tests --select=E9,F63,F7,F82,F401

      - name: Tests
        run: pytest -q

      - name: Console scripts
        run: |
          pcaplens --help
          pcaplens demo demo.pcap

      - name: Every command runs end to end
        run: |
          pcaplens summary demo.pcap
          pcaplens flows demo.pcap
          pcaplens dns demo.pcap
          pcaplens http demo.pcap
          pcaplens tls demo.pcap
          pcaplens packet demo.pcap 10
          pcaplens search demo.pcap --text example.com

      - name: MCP manifest
        run: pcaplens mcp --check

      # Soft check: the README test badge went stale twice (277 vs 282, 62 vs 57)
      # and nobody noticed. Print the mismatch instead of failing the build --
      # a wrong number should not turn CI red, but it must show in every log.
      - name: README test-count badge matches reality
        if: runner.os == 'Linux'
        run: |
          # -o addopts= neutralises a project-level addopts="-q": combined with the
          # -q below it becomes -qq, and pytest -qq drops the "N tests collected"
          # summary line, which emptied this check once already.
          actual=$(pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" || true)
          claimed=$(grep -oE "tests-[0-9]+%20passing" README.md | grep -oE "[0-9]+" | head -1 || true)
          echo "collected=${actual:-NOTHING} badge=${claimed:-NONE}"
          if [ -z "$actual" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$actual" != "$claimed" ]; then
            echo "::warning::README badge says $claimed but pytest collects $actual - update README.md"
          fi
